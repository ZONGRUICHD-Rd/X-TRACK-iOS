# XcodeGen spec for the X-TRACK iOS port.
#   brew install xcodegen && xcodegen generate   ->  XTrack.xcodeproj
name: XTrack

options:
  bundleIdPrefix: com.xtrack
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: zh-Hans

settings:
  base:
    MARKETING_VERSION: "2.7"
    CURRENT_PROJECT_VERSION: "1"

targets:
  XTrack:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    scheme: {}
    sources:
      # iOS platform layer + LVGL/HAL glue
      - path: XTrack
        excludes:
          - "Resources/Info.plist"
      # Original X-TRACK application (UI pages, data processing, utils) - unchanged
      - path: ../USER/App
        includes:
          - "**/*.c"
          - "**/*.cpp"
        excludes:
          - "Utils/ArduinoJson/**"   # header-only library, extras are tests/examples
          - "Utils/lv_img_png/**"    # not used (CONFIG_MAP_IMG_PNG_ENABLE = 0)
          - "Utils/new/**"           # embedded operator new override
      # LVGL v8.3 (same copy and lv_conf.h as the simulator / hardware builds)
      - path: ../Simulator/LVGL.Simulator/lvgl/src
        includes:
          - "**/*.c"
    dependencies:
      - sdk: UIKit.framework
      - sdk: CoreGraphics.framework
      - sdk: QuartzCore.framework
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: CoreLocation.framework
      - sdk: CoreMotion.framework
    settings:
      base:
        PRODUCT_NAME: XTrack
        PRODUCT_BUNDLE_IDENTIFIER: com.xtrack.ios
        INFOPLIST_FILE: XTrack/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_CXX_LANGUAGE_STANDARD: gnu++17
        GCC_C_LANGUAGE_STANDARD: gnu11
        # Many X-TRACK headers share names with system headers (Time.h, Stream.h...):
        # disable header maps and use explicit search paths instead.
        USE_HEADERMAP: NO
        ALWAYS_SEARCH_USER_PATHS: NO
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/XTrack/Core"
          - "$(SRCROOT)/../Simulator/LVGL.Simulator"
          - "$(SRCROOT)/../USER/App"
          - "$(SRCROOT)/../USER/App/Utils/ArduinoJson/src"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "LV_COLOR_DEPTH=16"
          - "LV_COLOR_16_SWAP=1"
        # Third-party/embedded sources are noisy; warnings are not errors.
        GCC_WARN_INHIBIT_ALL_WARNINGS: NO
        GCC_TREAT_WARNINGS_AS_ERRORS: NO
        OTHER_CFLAGS:
          - "$(inherited)"
          - "-Wno-shorten-64-to-32"
          - "-Wno-comma"
          - "-Wno-conditional-uninitialized"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEAD_CODE_STRIPPING: YES
